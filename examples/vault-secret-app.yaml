# Example app that fetches secrets from HashiCorp Vault
#
# Flow:
#   1. Init container authenticates to Vault with the ServiceAccount token (k8s auth method)
#   2. Fetches the secrets from secret/k8s-provisioner/grafana/admin
#   3. Writes them to /vault/secrets/ (in-memory emptyDir volume)
#   4. Main container reads the secrets from the volume
#
# Prerequisite — Vault serves TLS with its own CA; publish it as a ConfigMap
# (run from the vagrant/ directory):
#   vagrant ssh storage -c 'cat /etc/vault.d/tls/ca.crt' > vault-ca.crt
#   kubectl create configmap vault-ca -n default --from-file=ca.crt=vault-ca.crt
#
# Deploy:
#   kubectl apply -f examples/vault-secret-app.yaml
#
# Verify:
#   kubectl logs -l app=vault-demo -c app
#   kubectl exec -it deploy/vault-demo-app -- cat /vault/secrets/grafana-admin.json

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-demo
  namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo-app
  namespace: default
  labels:
    app: vault-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-demo
  template:
    metadata:
      labels:
        app: vault-demo
    spec:
      serviceAccountName: vault-demo

      initContainers:
      - name: vault-fetch-secrets
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          VAULT_ADDR="https://192.168.56.20:8200"
          CA=/vault-ca/ca.crt
          SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

          echo "[vault-init] Authenticating to Vault via Kubernetes auth..."
          RESPONSE=$(curl -sf --cacert "$CA" -X POST \
            "$VAULT_ADDR/v1/auth/kubernetes/login" \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"k8s-provisioner\",\"jwt\":\"$SA_TOKEN\"}")

          VAULT_TOKEN=$(echo "$RESPONSE" \
            | grep -o '"client_token":"[^"]*"' \
            | head -1 \
            | cut -d'"' -f4)

          if [ -z "$VAULT_TOKEN" ]; then
            echo "[vault-init] ERROR: failed to obtain a Vault token"
            echo "[vault-init] Response: $RESPONSE"
            exit 1
          fi

          echo "[vault-init] Token obtained. Fetching secrets..."
          curl -sf --cacert "$CA" \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/secret/data/k8s-provisioner/grafana/admin" \
            -o /vault/secrets/grafana-admin.json

          echo "[vault-init] Secrets saved to /vault/secrets/grafana-admin.json"
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
        - name: vault-ca
          mountPath: /vault-ca
          readOnly: true

      containers:
      - name: app
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "==============================="
          echo "  Vault Demo App"
          echo "==============================="
          echo ""
          echo "Secrets loaded from Vault:"
          echo ""
          cat /vault/secrets/grafana-admin.json
          echo ""
          echo "==============================="
          echo "App running..."
          sleep infinity
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        resources:
          requests:
            memory: 32Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: 50m

      volumes:
      - name: vault-secrets
        emptyDir:
          medium: Memory   # secrets live only in RAM, never on disk
      - name: vault-ca
        configMap:
          name: vault-ca