# k8s-provisioner configuration
#
# SECRETS: do NOT put real secrets in this tracked file. The secret fields below
# (vault.token, provisioning.ssh_password, karpor_ai.auth_token, ollama.api_key)
# are placeholders — supply real values via environment variables, which override
# whatever is here: K8S_PROV_VAULT_TOKEN, K8S_PROV_SSH_PASSWORD, KARPOR_AUTH_TOKEN,
# OLLAMA_API_KEY (or use a gitignored config.local.yaml).
#
# Vault (HashiCorp) - running on storage node
# token is auto-read from /etc/k8s-provisioner/vault-init.json if left empty
vault:
  enabled: true
  addr: ""     # Empty = derived as https://<storage-node-ip>:8200 from nodes:. Set to override.
  token: ""    # env K8S_PROV_VAULT_TOKEN; empty = auto-resolve from vault-init.json. Never commit a real token.
  ca_cert: ""  # env VAULT_CACERT; empty = /etc/k8s-provisioner/vault-ca.crt (fetched from the storage node).

# Lab DNS: CoreDNS + etcd on the storage node serve <name>.<domain> for every
# Istio Gateway host (records published by ExternalDNS) plus the lab nodes.
# On the host, point the domain at the storage node once (see README "Lab DNS").
dns:
  domain: "lab.internal"  # Base domain: grafana.lab.internal, keycloak.lab.internal, ...

# Node-to-node SSH used to copy Vault init data from controlplane to the storage
# node. Defaults target the Vagrant lab box. For non-lab use, set ssh_key_path
# (preferred) or ssh_password instead of relying on the default Vagrant credential.
provisioning:
  ssh_user: ""      # default: vagrant
  ssh_password: ""  # env K8S_PROV_SSH_PASSWORD; default vagrant; prefer ssh_key_path. Never commit a real password.
  ssh_key_path: ""  # path to a private key for key-based auth (preferred)

cluster:
  name: "k8s-lab"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"
  timezone: "America/Sao_Paulo"   # IANA name; every node (incl. storage) and Grafana. Empty = UTC

versions:
  kubernetes: "1.37"
  crio: "v1.37"
  calico: "3.33.0"
  metallb: "0.16.0"
  istio: "1.31.3"
  karpor: "0.7.8"
  grafana: "13.2.4"
  loki: "3.7.9"
  alloy: "v1.21.1"
  tempo: "3.1.1"
  otel_collector: "0.163.2"
  keycloak: "26.8.1"
  postgres: "18"
  kiali: "v2.33.0"
  node_exporter: "v1.12.1"
  kube_state_metrics: "v2.20.0"
  metrics_server: "v0.9.0"
  prometheus_operator: "v0.94.1"
  cert_manager: "v1.21.2"
  prometheus: "v3.15.1"
  alertmanager: "v0.34.1"
  vpa: "0.15.0"          # Helm chart version (app 1.8.1)
  coredns: "1.15.0"       # Lab DNS on the storage node (read by vagrant/Vagrantfile)
  etcd: "v3.7.3"          # DNS record store on the storage node (read by vagrant/Vagrantfile)
  external_dns: "v0.23.0"
  blackbox_exporter: "v0.29.1"   # TLS certificate expiry probes (lab dashboard)
  resource_dashboard: "982c301aaeb251c07c75476922c80a8090b05e35"  # workload resources dashboard + rules: upstream commit (no release tags)

network:
  interface: "eth1"
  # controlplane_ip is derived from the controlplane node in `nodes:` (single
  # source of truth). Set it here only to override that derived value.
  metallb_range: "192.168.56.200-192.168.56.250"

storage:
  nfs_server: "storage"       # Uses hostname from /etc/hosts
  nfs_path: "/exports/k8s-volumes"
  default_dynamic: true       # If true, nfs-dynamic is the default StorageClass (auto-provisioning)

# Node definitions - IPs should match vagrant/settings.yaml
nodes:
  - name: "storage"
    ip: "192.168.56.20"
    role: "storage"
  - name: "controlplane"
    ip: "192.168.56.10"
    role: "controlplane"
  - name: "node01"
    ip: "192.168.56.11"
    role: "worker"
  - name: "node02"
    ip: "192.168.56.12"
    role: "worker"

components:
  cni: "calico"
  load_balancer: "metallb"
  service_mesh: "istio"
  monitoring: "prometheus-stack"  # Options: prometheus-stack, none
  logging: "loki"                 # Options: loki, none (requires monitoring)
  tracing: "otel-tempo"           # Options: otel-tempo, none (requires monitoring; trace→log links need logging)
  karpor: "none"                  # Options: none, enabled (requires extra resources: ~1.5 CPU, ~2GB RAM)
  keycloak: "enabled"             # Options: enabled, none (OIDC identity provider for kubectl + Grafana SSO)
  vpa: "enabled"                  # Options: enabled, none (Vertical Pod Autoscaler — adjusts CPU/Memory per pod)
  keda: "enabled"                 # Options: enabled, none (Event-driven autoscaling — scale to zero, Prometheus triggers)
  external_dns: "enabled"         # Options: enabled, none (publishes Gateway hosts to the lab DNS on the storage node)

# Karpor AI configuration (optional)
# When backend is "ollama", Ollama will be installed inside the cluster automatically
# Requires karpor: "enabled" above
karpor_ai:
  enabled: false
  backend: "ollama"    # Options: openai, azureopenai, huggingface, ollama
  auth_token: ""       # env KARPOR_AUTH_TOKEN; not needed for ollama local. Never commit a real token.
  base_url: ""         # Leave empty to use internal Ollama service
  model: "llama3.2:3b" # Local model (runs inside the cluster, ~2GB, better quality)

# Ollama configuration (optional)
# Only needed if using Ollama cloud models (e.g., minimax-m2.5:cloud)
# Requires karpor_ai.enabled: true and karpor_ai.backend: "ollama"
ollama:
  api_key: ""          # env OLLAMA_API_KEY (https://ollama.com/settings/keys). Never commit a real key.
  # Cloud models available: minimax-m2.5:cloud, qwen3-coder:480b-cloud, glm-4.7:cloud
  # To use cloud model, set karpor_ai.model to a :cloud variant above