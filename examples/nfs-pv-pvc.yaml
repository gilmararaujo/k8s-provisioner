# ===========================================
# Example: NFS Storage + Istio
# ===========================================
#
# Available StorageClasses:
#   - nfs-dynamic: Automatic provisioning (PV created automatically)
#   - nfs-static:  Manual provisioning (requires a pre-created PV)
#
# NFS Server: 192.168.56.20 (storage)
# NFS Path: /exports/k8s-volumes
# Access: http://<INGRESS_IP>/
# ===========================================

# ===========================================
# EXAMPLE 1: Using nfs-dynamic (automatic)
# ===========================================
# With nfs-dynamic, just create the PVC and the PV is created automatically

---
apiVersion: v1
kind: Namespace
metadata:
  name: dynamic-demo
  labels:
    istio-injection: enabled
---
# PVC with dynamic provisioning - the PV will be created automatically
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-dynamic
  namespace: dynamic-demo
spec:
  storageClassName: nfs-dynamic
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dynamic
  namespace: dynamic-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-dynamic
  template:
    metadata:
      labels:
        app: nginx-dynamic
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: web-data
          mountPath: /usr/share/nginx/html
      initContainers:
      - name: init-content
        image: busybox
        command: ['sh', '-c', 'echo "<h1>NFS Dynamic Storage</h1><p>Hostname: $(hostname)</p><p>Date: $(date)</p><p>PV created automatically!</p>" > /data/index.html']
        volumeMounts:
        - name: web-data
          mountPath: /data
      volumes:
      - name: web-data
        persistentVolumeClaim:
          claimName: app-data-dynamic

# ===========================================
# EXAMPLE 2: Using nfs-static (manual)
# ===========================================
# With nfs-static, you must create the PV manually before the PVC

---
apiVersion: v1
kind: Namespace
metadata:
  name: static-demo
  labels:
    istio-injection: enabled
---
# Manual PV - created before the PVC
apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-pv01
  labels:
    storage: nfs
spec:
  storageClassName: nfs-static
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.56.20
    path: /exports/k8s-volumes/static-pv01
---
# PVC that uses the manual PV
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-data-static
  namespace: static-demo
spec:
  storageClassName: nfs-static
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-static
  namespace: static-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-static
  template:
    metadata:
      labels:
        app: nginx-static
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: web-data
          mountPath: /usr/share/nginx/html
      initContainers:
      - name: init-content
        image: busybox
        command: ['sh', '-c', 'echo "<h1>NFS Static Storage</h1><p>Hostname: $(hostname)</p><p>Date: $(date)</p><p>PV created manually!</p>" > /data/index.html']
        volumeMounts:
        - name: web-data
          mountPath: /data
      volumes:
      - name: web-data
        persistentVolumeClaim:
          claimName: app-data-static

# ===========================================
# EXAMPLE 3: PV with claimRef (direct binding)
# ===========================================
# Use claimRef when you need to guarantee that a specific PV
# is bound to a specific PVC (as Karpor does)

---
apiVersion: v1
kind: Namespace
metadata:
  name: claimref-demo
---
# PV with claimRef - reserved for a specific PVC
apiVersion: v1
kind: PersistentVolume
metadata:
  name: reserved-pv
spec:
  storageClassName: nfs-static
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: claimref-demo
    name: reserved-pvc
  nfs:
    server: 192.168.56.20
    path: /exports/k8s-volumes/reserved-data
---
# PVC that will be bound automatically to the PV above
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reserved-pvc
  namespace: claimref-demo
spec:
  storageClassName: nfs-static
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

# ===========================================
# Services and Istio (for the examples above)
# ===========================================
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-dynamic
  namespace: dynamic-demo
spec:
  selector:
    app: nginx-dynamic
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-static
  namespace: static-demo
spec:
  selector:
    app: nginx-static
  ports:
  - port: 80
    targetPort: 80
---
# Istio Gateway for the demo
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: nfs-demo-gateway
  namespace: dynamic-demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "nfs-dynamic.local"
    - "nfs-static.local"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nginx-dynamic
  namespace: dynamic-demo
spec:
  hosts:
  - "nfs-dynamic.local"
  gateways:
  - nfs-demo-gateway
  http:
  - route:
    - destination:
        host: nginx-dynamic
        port:
          number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nginx-static
  namespace: static-demo
spec:
  hosts:
  - "nfs-static.local"
  gateways:
  - dynamic-demo/nfs-demo-gateway
  http:
  - route:
    - destination:
        host: nginx-static.static-demo.svc.cluster.local
        port:
          number: 80
